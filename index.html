<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Visitor Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-sm border border-gray-200">
            <h1 class="text-2xl font-bold text-center mb-1 text-blue-600">Visitor Pass System</h1>
            <p class="text-xs text-gray-500 text-center mb-6">School Security & Admin Portal</p>
            <div class="space-y-4">
                <input type="email" id="login-email" placeholder="Email Address (Staff / Admin)" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                <input type="password" id="login-password" placeholder="Password" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                
                <div class="pt-2 space-y-2">
                    <button onclick="handleLogin()" id="login-btn" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 shadow">
                        Secure Staff / Admin Login
                    </button>
                    <!-- FEATURE 1: NO LOGIN REQUIRED FOR SECURITY -->
                    <button onclick="openSecurityDirectly()" class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-900 shadow border border-gray-700 flex items-center justify-center gap-2">
                        <span>📷</span> Open Security Scanner (No Login)
                    </button>
                </div>
                <p id="login-error" class="text-red-500 text-xs text-center hidden"></p>
            </div>
        </div>
    </div>

    <!-- STAFF SCREEN (REQUEST PASS) -->
    <div id="staff-screen" class="hidden flex-col min-h-screen">
        <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md">
            <h1 class="font-bold text-lg">Staff Pass Request</h1>
            <button onclick="logout()" class="text-sm underline bg-blue-700 px-3 py-1 rounded">Logout</button>
        </header>
        <main class="flex-1 p-4 w-full max-w-md mx-auto space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200">
                <h2 class="font-bold text-gray-700 mb-4 border-b pb-2">Request Visitor Pass</h2>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs font-bold text-gray-500">VISITOR NAME</label>
                        <input type="text" id="v-name" placeholder="John Doe" class="w-full p-2.5 border rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500">VISITOR WHATSAPP</label>
                        <input type="tel" id="v-phone" placeholder="60123456789" class="w-full p-2.5 border rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500">HOST NAME / TEACHER</label>
                        <input type="text" id="v-host" placeholder="Mr. Smith" class="w-full p-2.5 border rounded-lg outline-none">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500">HOST PHONE NUMBER</label>
                        <input type="tel" id="v-host-phone" placeholder="60198765432" class="w-full p-2.5 border rounded-lg outline-none">
                    </div>

                    <!-- FEATURE 3: START TIME AND END TIME SELECTION (8 AM - 6 PM) -->
                    <div class="grid grid-cols-2 gap-2 pt-1">
                        <div>
                            <label class="text-xs font-bold text-gray-500">START TIME</label>
                            <select id="v-start-time" class="w-full p-2.5 border rounded-lg outline-none bg-white">
                                <option value="8:00 AM">8:00 AM</option>
                                <option value="9:00 AM">9:00 AM</option>
                                <option value="10:00 AM">10:00 AM</option>
                                <option value="11:00 AM">11:00 AM</option>
                                <option value="12:00 PM">12:00 PM</option>
                                <option value="1:00 PM">1:00 PM</option>
                                <option value="2:00 PM">2:00 PM</option>
                                <option value="3:00 PM">3:00 PM</option>
                                <option value="4:00 PM">4:00 PM</option>
                                <option value="5:00 PM">5:00 PM</option>
                                <option value="6:00 PM">6:00 PM</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-500">END TIME</label>
                            <select id="v-end-time" class="w-full p-2.5 border rounded-lg outline-none bg-white">
                                <option value="9:00 AM">9:00 AM</option>
                                <option value="10:00 AM">10:00 AM</option>
                                <option value="11:00 AM">11:00 AM</option>
                                <option value="12:00 PM">12:00 PM</option>
                                <option value="1:00 PM">1:00 PM</option>
                                <option value="2:00 PM">2:00 PM</option>
                                <option value="3:00 PM">3:00 PM</option>
                                <option value="4:00 PM">4:00 PM</option>
                                <option value="5:00 PM">5:00 PM</option>
                                <option value="6:00 PM" selected>6:00 PM</option>
                            </select>
                        </div>
                    </div>

                    <button onclick="requestPass()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 shadow mt-2">
                        Submit for Admin Approval
                    </button>
                </div>
            </div>
            <div id="request-success" class="hidden bg-green-100 p-4 rounded-xl text-green-800 text-center font-bold border border-green-200">
                ✅ Request sent to Head Admin!
            </div>
        </main>
    </div>

    <!-- HEAD ADMIN SCREEN (APPROVAL DASHBOARD) -->
    <div id="admin-screen" class="hidden flex-col min-h-screen">
        <header class="bg-purple-600 text-white p-4 flex justify-between items-center shadow-md">
            <h1 class="font-bold text-lg">Admin Approval Board</h1>
            <button onclick="logout()" class="text-sm underline bg-purple-700 px-3 py-1 rounded">Logout</button>
        </header>
        <main class="flex-1 p-4 w-full max-w-md mx-auto space-y-4">
            <h2 class="font-bold text-gray-700">Pending Requests</h2>
            <div id="pending-list" class="space-y-3"></div>
        </main>
    </div>

    <!-- SECURITY SCANNER SCREEN -->
    <div id="security-screen" class="hidden flex-col min-h-screen bg-gray-900 text-white">
        <header class="bg-gray-800 p-4 flex justify-between items-center shadow-md">
            <h1 class="font-bold text-lg">Gate Security Scanner</h1>
            <button onclick="logout()" class="text-sm underline bg-gray-700 px-3 py-1 rounded">Exit Scanner</button>
        </header>
        
        <main class="flex-1 p-4 flex flex-col items-center justify-center w-full max-w-md mx-auto space-y-4">
            <div class="w-full bg-black rounded-xl overflow-hidden border-2 border-gray-700 min-h-[260px] relative">
                <div id="reader" class="w-full"></div>
            </div>
            
            <div class="w-full flex gap-2">
                <button onclick="startScanner()" class="w-full bg-blue-600 font-bold py-3 rounded-xl hover:bg-blue-700 shadow">Start Camera</button>
                <button onclick="stopScanner()" class="w-full bg-gray-700 font-bold py-3 rounded-xl hover:bg-gray-600 shadow">Stop Camera</button>
            </div>
            
            <!-- FEATURE 2: SCAN STATUS & DETAILED VISITOR CARD DISPLAY -->
            <div id="scan-status" class="w-full p-4 rounded-xl text-center text-sm bg-gray-800 text-gray-300 min-h-[80px] flex items-center justify-center border border-gray-700">
                Ready to scan QR Code...
            </div>
        </main>
    </div>

    <!-- FIREBASE AND APPLICATION LOGIC -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, getDocs, getDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDj_w9fbNE34dKQxSjRbKv1PEmLj69HeeQ",
            authDomain: "jubli-edupass.firebaseapp.com",
            projectId: "jubli-edupass",
            storageBucket: "jubli-edupass.firebasestorage.app",
            messagingSenderId: "202573037544",
            appId: "1:202573037544:web:66c2e73f3fe16ff1a36e5d",
            measurementId: "G-0FJDSGP5MF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        let html5QrcodeScanner = null;

        // FEATURE 1: NO LOGIN SECURITY ROUTE
        window.openSecurityDirectly = function() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('security-screen').classList.replace('hidden', 'flex');
        };

        // STAFF / ADMIN LOGIN
        window.handleLogin = async function() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const btn = document.getElementById('login-btn');
            const errorText = document.getElementById('login-error');

            if (!email || !password) return alert("Please enter email and password.");

            btn.innerText = "Authenticating...";
            errorText.classList.add('hidden');

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                const userDoc = await getDoc(doc(db, "users", user.uid));
                
                if (userDoc.exists()) {
                    routeUserToScreen(userDoc.data().role);
                } else {
                    throw new Error("No role assigned to this user in Firestore.");
                }
            } catch (error) {
                errorText.innerText = "Login failed: " + error.message;
                errorText.classList.remove('hidden');
            } finally {
                btn.innerText = "Secure Staff / Admin Login";
            }
        };

        function routeUserToScreen(role) {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';

            if(role === 'staff') document.getElementById('staff-screen').classList.replace('hidden', 'flex');
            if(role === 'admin') {
                document.getElementById('admin-screen').classList.replace('hidden', 'flex');
                listenForApprovals(); 
            }
            if(role === 'security') document.getElementById('security-screen').classList.replace('hidden', 'flex');
        }

        window.logout = function() {
            signOut(auth).then(() => {
                window.stopScanner();
                document.querySelectorAll('div[id$="-screen"]').forEach(el => {
                    el.classList.add('hidden');
                    el.classList.remove('flex');
                });
                document.getElementById('login-screen').classList.replace('hidden', 'flex');
            });
        };

        // STAFF REQUEST PASS
        window.requestPass = async function() {
            const name = document.getElementById('v-name').value.trim();
            const phone = document.getElementById('v-phone').value.trim();
            const host = document.getElementById('v-host').value.trim();
            const hostPhone = document.getElementById('v-host-phone').value.trim();
            const startTime = document.getElementById('v-start-time').value;
            const endTime = document.getElementById('v-end-time').value;

            if(!name || !phone || !host || !hostPhone) return alert("Please fill in all fields including Host Phone.");

            const visitId = 'VISIT-' + Math.random().toString(36).substr(2, 7).toUpperCase();
            
            try {
                await addDoc(collection(db, "visits"), {
                    visitId, visitorName: name, phone, hostName: host, hostPhone: hostPhone,
                    startTime, endTime,
                    status: "Awaiting Approval",
                    createdAt: serverTimestamp()
                });
                
                document.getElementById('request-success').classList.replace('hidden', 'block');
                setTimeout(() => {
                    document.getElementById('request-success').classList.replace('block', 'hidden');
                    document.getElementById('v-name').value = '';
                    document.getElementById('v-phone').value = '';
                    document.getElementById('v-host').value = '';
                    document.getElementById('v-host-phone').value = '';
                }, 3000);
            } catch (e) { alert("Error submitting request: " + e.message); }
        };

        // ADMIN APPROVE & SEND WHATSAPP
        window.approveAndSend = async function(docId, visitId, name, phone, host, startTime, endTime) {
            const waWindow = window.open('', '_blank');
            
            try {
                await updateDoc(doc(db, "visits", docId), { status: "Pending" });
                
                const qrLink = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${visitId}`;
                const textMessage = `Hello ${name}! 👋\n\nYour school visitor pass has been APPROVED.\n\n🎟️ *Pass ID:* ${visitId}\n👤 *Host:* ${host}\n⏰ *Visiting Hours:* ${startTime} - ${endTime}\n\n📱 *View QR Code:*\n${qrLink}`;
                const waUrl = `https://wa.me/${phone.replace(/[^0-9]/g, '')}?text=${encodeURIComponent(textMessage)}`;
                
                waWindow.location.href = waUrl;
            } catch(e) {
                waWindow.close();
                alert("Error approving pass: " + e.message);
            }
        };

        function listenForApprovals() {
            const q = query(collection(db, "visits"), where("status", "==", "Awaiting Approval"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('pending-list');
                list.innerHTML = '';
                
                if(snapshot.empty) list.innerHTML = '<p class="text-sm text-gray-500">No pending requests.</p>';

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    list.innerHTML += `
                        <div class="bg-white p-4 rounded-lg border shadow-sm flex justify-between items-center">
                            <div>
                                <p class="font-bold text-sm">${data.visitorName}</p>
                                <p class="text-xs text-gray-500">Host: ${data.hostName} (${data.hostPhone || 'No Phone'})</p>
                                <p class="text-xs text-blue-600 font-semibold">⏰ ${data.startTime} - ${data.endTime}</p>
                            </div>
                            <button onclick="approveAndSend('${docSnap.id}', '${data.visitId}', '${data.visitorName}', '${data.phone}', '${data.hostName}', '${data.startTime}', '${data.endTime}')" 
                                    class="bg-green-500 text-white text-xs font-bold px-3 py-2 rounded hover:bg-green-600">
                                Approve & Send
                            </button>
                        </div>
                    `;
                });
            });
        }

        // FEATURE 2: CAMERA SCANNER & DISPLAY VISITOR + HOST DETAILS
        window.startScanner = function() {
            if (!html5QrcodeScanner) html5QrcodeScanner = new Html5Qrcode("reader");
            html5QrcodeScanner.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 220, height: 220 } }, async (decodedText) => {
                html5QrcodeScanner.pause();
                const statusDiv = document.getElementById('scan-status');
                statusDiv.innerHTML = `<span class="text-blue-400 font-bold">Checking: ${decodedText}...</span>`;

                const q = query(collection(db, "visits"), where("visitId", "==", decodedText.trim()));
                const snaps = await getDocs(q);

                if (snaps.empty) {
                    statusDiv.innerHTML = `<span class="text-red-400 font-bold">❌ INVALID PASS ID</span>`;
                } else {
                    snaps.forEach(async (d) => {
                        const data = d.data();
                        
                        if (data.status === "Awaiting Approval") {
                            statusDiv.innerHTML = `<span class="text-red-400 font-bold">❌ PASS NOT APPROVED YET</span>`;
                        } else if (data.status === "Pending") {
                            await updateDoc(doc(db, "visits", d.id), { status: "Checked-In", checkInTime: serverTimestamp() });
                            
                            // DETAILED CARD DISPLAY ON CHECK-IN
                            statusDiv.innerHTML = `
                                <div class="bg-gray-800 p-4 rounded-xl text-left border border-green-500 w-full space-y-1.5">
                                    <div class="text-green-400 font-bold text-base border-b border-gray-700 pb-1 mb-2">✅ CHECK-IN SUCCESSFUL</div>
                                    <p><span class="text-gray-400 font-semibold">👤 Visitor:</span> <span class="text-white font-bold">${data.visitorName}</span></p>
                                    <p><span class="text-gray-400 font-semibold">📱 Visitor Phone:</span> <span class="text-white">${data.phone}</span></p>
                                    <p><span class="text-gray-400 font-semibold">🏫 Host Name:</span> <span class="text-white font-bold">${data.hostName}</span></p>
                                    <p><span class="text-gray-400 font-semibold">📞 Host Phone:</span> <span class="text-blue-300 font-bold">${data.hostPhone || 'N/A'}</span></p>
                                    <p><span class="text-gray-400 font-semibold">⏰ Visiting Hours:</span> <span class="text-yellow-300 font-bold">${data.startTime} - ${data.endTime}</span></p>
                                </div>
                            `;
                        } else {
                            statusDiv.innerHTML = `
                                <div class="bg-gray-800 p-4 rounded-xl text-left border border-yellow-500 w-full space-y-1 text-xs">
                                    <div class="text-yellow-400 font-bold text-sm mb-1">⚠️ PASS ALREADY CHECKED-IN</div>
                                    <p><span class="text-gray-400">Visitor:</span> ${data.visitorName}</p>
                                    <p><span class="text-gray-400">Host:</span> ${data.hostName} (${data.hostPhone || 'N/A'})</p>
                                </div>
                            `;
                        }
                    });
                }
                setTimeout(() => html5QrcodeScanner.resume(), 4000);
            }, () => {});
        };

        window.stopScanner = () => html5QrcodeScanner?.stop();
    </script>
</body>
</html>
